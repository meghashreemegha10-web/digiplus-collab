        .welcome-btn::before {
            content: '';

                if (order.amount >= 149900) setPaymentStatus('1499');
                else if (order.amount >= 99900) setPaymentStatus('999');
                hidePaymentSection();
                window.location.href = 'IntroPage.html';
              },
              prefill: { name: '', email: '', contact: '' },
              theme: { color: '#3399cc' }
            };
            const rzp = new Razorpay(options);
            rzp.open();
          } else {
            alert('Failed to create Razorpay order.');
          }
        } catch (err) {
          alert('Error: ' + err.message);
        }
      };
    }
  </script>
