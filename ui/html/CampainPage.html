    <script>
    // Enforce payment access on live website, but allow open preview for the hoster on localhost
    (function enforceAccess() {
      const hostname = window.location.hostname;
      const isLocalhost = hostname === 'localhost' || 
                          hostname === '127.0.0.1' || 
                          hostname.startsWith('192.168.') || 
                          hostname.endsWith('.local') || 
                          window.location.protocol === 'file:';
      if (isLocalhost) return;

      const hasAccess = localStorage.getItem('accessGranted') === 'true' ||
                        localStorage.getItem('scanPaid') === 'true' ||
                        localStorage.getItem('paymentStatus') === '1499' ||
                        localStorage.getItem('unlocked_option_3') === 'true';
      if (!hasAccess) {
        alert('This YouTube Masterclass is locked. Please complete enrollment to access.');
        window.location.href = 'IntroPage.html?option=3';
      }
    })();

    function showSpinner() {
        document.getElementById('loadingSpinner').style.display = 'flex';
    }
    function hideSpinner() {
        document.getElementById('loadingSpinner').style.display = 'none';
    }
    function showYoutubeCampaignPopup() {
      document.getElementById('youtube-campaign-popup').style.display = 'flex';
      var vid = document.getElementById('youtube-campaign-video');
      vid.currentTime = 0;
      vid.pause(); // Do not autoplay
    }
    function closeYoutubeCampaignPopup() {
      document.getElementById('youtube-campaign-popup').style.display = 'none';
      var vid = document.getElementById('youtube-campaign-video');
      vid.pause();
    }
    function showCampaignSetupPopup() {
      document.getElementById('campaign-setup-popup').style.display = 'flex';
      var vid = document.getElementById('campaign-setup-video');
      vid.currentTime = 0;
      vid.pause(); // Do not autoplay
    }
    function closeCampaignSetupPopup() {
      document.getElementById('campaign-setup-popup').style.display = 'none';
      var vid = document.getElementById('campaign-setup-video');
      vid.pause();
    }
    function showBillingPopup() {
      document.getElementById('billing-popup').style.display = 'flex';
      var vid = document.getElementById('billing-video');
      vid.currentTime = 0;
      vid.pause(); // Do not autoplay
    }
    function closeBillingPopup() {
      document.getElementById('billing-popup').style.display = 'none';
      var vid = document.getElementById('billing-video');
      vid.pause();
    }
    function showAnalyzeDataPopup() {
      document.getElementById('analyze-data-popup').style.display = 'flex';
      var vid = document.getElementById('analyze-data-video');
      vid.currentTime = 0;
      vid.pause(); // Do not autoplay
    }
    function closeAnalyzeDataPopup() {
      document.getElementById('analyze-data-popup').style.display = 'none';
      var vid = document.getElementById('analyze-data-video');
      vid.pause();
    }
    // Disable all sidebar buttons and Next button until payment is successful
    const sidebarBtns = document.querySelectorAll('.button-sidebar .btn-group');
    const nextBtn = document.getElementById('goToBusinessBtn');
    const payYoutubeBtn = document.getElementById('payYoutubeBtn');
    sidebarBtns.forEach(btn => btn.setAttribute('disabled', 'disabled'));
    sidebarBtns.forEach(btn => {
      btn.style.pointerEvents = 'none';
      btn.style.opacity = '0.5';
      btn.style.filter = 'grayscale(0.7)';
    });
    // Disable Next button by default
    if (nextBtn) {
      nextBtn.setAttribute('disabled', 'disabled');
      nextBtn.style.pointerEvents = 'none';
      nextBtn.style.opacity = '0.5';
      nextBtn.style.filter = 'grayscale(0.7)';
    }

    // Check localStorage for payment status
    let campaignPaid = localStorage.getItem('campaignPaid') === 'true';
    if (campaignPaid) {
      enableSidebarButtons();
      enableNextButton();
      disablePayYoutubeBtn();
    }

    // If user has already paid for campaign, redirect to BusinessAccount.html
    if (localStorage.getItem('campaignPaid') === 'true') {
      window.location.href = 'BusinessAccount.html';
    }

    // Enforce backend payment status check on page load
    (async function() {
      try {
        const res = await fetch('/user-access-status', { credentials: 'include' });
        if (res.ok) {
          const status = await res.json();
          if (status.campaignPaid) {
            localStorage.setItem('campaignPaid', 'true');
            enableSidebarButtons();
            enableNextButton();
            disablePayYoutubeBtn();
            // Optionally redirect if you want to skip this page
            // window.location.href = 'BusinessAccount.html';
          } else {
            localStorage.removeItem('campaignPaid');
          }
        }
      } catch (e) {
        // Optionally show error or fallback
      }
    })();

    function enableSidebarButtons() {
      sidebarBtns.forEach(btn => btn.removeAttribute('disabled'));
      sidebarBtns.forEach(btn => {
        btn.style.pointerEvents = '';
        btn.style.opacity = '';
        btn.style.filter = '';
      });
    }
    function enableNextButton() {
      if (nextBtn) {
        nextBtn.removeAttribute('disabled');
        nextBtn.style.pointerEvents = '';
        nextBtn.style.opacity = '';
        nextBtn.style.filter = '';
      }
    }
    function disablePayYoutubeBtn() {
      if (payYoutubeBtn) {
        payYoutubeBtn.disabled = true;
        payYoutubeBtn.textContent = 'Already Paid';
        payYoutubeBtn.style.opacity = '0.6';
        payYoutubeBtn.style.pointerEvents = 'none';
        payYoutubeBtn.style.filter = 'grayscale(0.7)';
      }
    }

    document.getElementById("goToBusinessBtn")?.addEventListener("click", function() {
      window.location.href = "BusinessAccount.html";
    });
    document.getElementById("payYoutubeBtn")?.addEventListener("click", function() {
      const userId = localStorage.getItem('userId');
      const email = localStorage.getItem('email') || '';
      const name = localStorage.getItem('name') || '';
      fetch("/create-order", {
        method: "POST",
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, amount: 149900, purpose: 'campaign' }) // ₹1499 in paise, purpose added
      })
        .then(res => res.json())
        .then(order => {
          if (order && order.id) {
            const options = {
              key: 'rzp_live_SgVjOOUUHbzBIS', // Razorpay live key
              amount: order.amount,
              currency: order.currency,
              name: 'GLOBAL DIGI PULSE',
              description: 'Unlock YouTube Campaign Videos',
              order_id: order.id,
              handler: function (response) {
                // Verify payment on backend before granting access
                fetch('/verify-payment', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    razorpay_payment_id: response.razorpay_payment_id,
                    razorpay_order_id: response.razorpay_order_id,
                    razorpay_signature: response.razorpay_signature,
                    userId: userId
                  })
                })
                  .then(res => res.json())
                  .then(data => {
                    if (data.success) {
                      localStorage.setItem('campaignPaid', 'true');
                      enableSidebarButtons();
                      enableNextButton();
                      disablePayYoutubeBtn();
                    } else {
                      alert('Payment verification failed. Please contact support.');
                    }
                  })
                  .catch(() => {
                    alert('Server error during payment verification.');
                  });
              },
              prefill: {
                name: name,
                email: email
              },
              theme: {
                color: '#ff4e50'
              },
              modal: {
                ondismiss: function() {
                  // Optionally handle modal close
                }
              }
            };
            const rzp = new Razorpay(options);
            rzp.open();
          } else {
            alert('Failed to create order.');
          }
        })
        .catch(() => {
          alert('Server error. Please try again or contact support.');
        });
    });
    // Payment logic for persistent access control
function checkPaymentStatus() {
    const paymentStatus = localStorage.getItem('paymentStatus');
    const paymentSection = document.getElementById('payment-section');
    // Hide payment section if already paid
    if (paymentStatus === '999' || paymentStatus === '1499') {
        if (paymentSection) paymentSection.style.display = 'none';
        // Enable features/buttons based on tier
        if (paymentStatus === '1499') {
            document.body.classList.add('premium');
            // Enable all campaign buttons
            document.querySelectorAll('.campaign-btn').forEach(btn => btn.disabled = false);
        } else {
            document.body.classList.add('basic');
            // Disable advanced campaign buttons
            document.querySelectorAll('.premium-only').forEach(btn => btn.disabled = true);
        }
    } else {
        if (paymentSection) paymentSection.style.display = '';
        // Restrict all campaign features
        document.querySelectorAll('.campaign-btn').forEach(btn => btn.disabled = true);
        document.body.classList.add('no-access');
    }
}
document.addEventListener('DOMContentLoaded', checkPaymentStatus);
    </script>
