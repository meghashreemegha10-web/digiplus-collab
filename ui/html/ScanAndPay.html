<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLOBAL DIGI PULSE</title>
  <link rel="stylesheet" href="../css/app2.css">
  <link rel="icon" type="image/png" href="../images/icon-7797704_640.JPG">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="../css/magical-world.css?v=9.0">
  <link rel="stylesheet" href="../css/madgicx-motion.css?v=1.0">
  <style>
    body {
      background: 
        radial-gradient(circle at 14% 18%, rgba(212, 175, 55, 0.14), transparent 42%),
        radial-gradient(circle at 86% 22%, rgba(226, 191, 111, 0.12), transparent 42%),
        radial-gradient(circle at 50% 60%, rgba(255, 255, 255, 0.95), transparent 55%),
        linear-gradient(180deg, #FFFFFF 0%, #FAF9F6 35%, #F5F3EF 70%, #FAF9F6 100%) !important;
      background-color: #FAF9F6 !important;
      background-size: cover !important;
      min-height: 100vh;
    }
    .container { display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90vh; }
    .btn { margin-top: 24px; padding: 12px 24px; font-size: 18px; border-radius: 24px; background: #3399cc; color: #fff; border: none; cursor: pointer; }
    @keyframes glow {
      0% { box-shadow: 0 0 16px #f9d423; }
      100% { box-shadow: 0 0 32px #e0e7ff; }
    }
    .btn:hover { background:#D4AF37 !important; color:#fff !important; }
    @media (max-width:600px) {
      .container > div { max-width:98vw !important; padding:16px !important; }
    }
    .scanpay-card { animation: fadeIn 1s; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(40px);} to { opacity:1; transform:translateY(0);} }
    #scanner-placeholder { animation: glowScanner 2s infinite alternate; }
    @keyframes glowScanner { 0% { box-shadow:0 0 24px #e0e7ff,0 0 8px #f9d423; } 100% { box-shadow:0 0 48px #4db0e1,0 0 16px #eac222; } }
  </style>
</head>
<body class="page-scanpay">
    <script>
      // Redirect paid users away from ScanAndPay if already paid
      (function() {
        const scanPaid = localStorage.getItem('scanPaid');
        if (scanPaid === 'true') {
          window.location.href = 'WelcomePage.html';
        }
      })();
    </script>
    <div class="container" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90vh;">
      <h2 style="font-weight:900;text-transform:uppercase;font-size:clamp(2.6rem, 4.5vw, 3.6rem);letter-spacing:1px;color:#fff;text-shadow:0 0 25px rgba(255,78,80,0.6), 0 2px 10px #f9d423;margin-bottom:20px;text-align:center;">Pay to Unlock the Videos</h2>
      <div id="offer-timer" style="font-size:2.6rem;color:#fef08a;font-weight:900;margin-bottom:24px;text-align:center;text-shadow:0 0 18px rgba(254,240,138,0.6);">Grab the offer within <span id="timer" style="color:#ffffff;text-decoration:underline;">07:00</span></div>
      <div class="scanpay-card" style="background:rgba(12,19,44,0.72) !important;backdrop-filter:blur(16px);border:1.5px solid rgba(56,189,248,0.45);box-shadow:0 12px 40px rgba(0,0,0,0.6), 0 0 35px rgba(56,189,248,0.3);border-radius:32px;padding:48px 36px;display:flex;flex-direction:column;align-items:center;max-width:560px;width:100%;margin-bottom:32px;position:relative;overflow:hidden;">
        <div style="position:absolute;top:-40px;right:-40px;width:120px;height:120px;background:radial-gradient(circle,#F0D478 60%,#ff4e50 100%);opacity:0.18;border-radius:50%;z-index:0;"></div>
        <div style="position:absolute;bottom:-40px;left:-40px;width:120px;height:120px;background:radial-gradient(circle,#D4AF37 60%,#b37faa 100%);opacity:0.18;border-radius:50%;z-index:0;"></div>
        <h3 style="font-weight:900;font-size:2.6rem;color:#ffffff;text-align:center;margin-bottom:24px;text-shadow:0 0 20px rgba(56,189,248,0.6);z-index:1;background:linear-gradient(135deg,#ffffff 0%,#fef08a 40%,#38bdf8 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">WELCOME TO GLOBAL DIGI PULSE</h3>
        <div style="margin-bottom:20px;z-index:1;">
          <img src="../images/lock.jpg" alt="Lock Icon" style="width:64px;height:64px;box-shadow:0 2px 14px #F0D478;border-radius:50%;background:#fff;">
        </div>
        <div id="upiQrContainer" style="display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;width:100%;">
          <div style="margin-top:18px;text-align:center;width:100%;">
            <button id="payBtn" style="background:linear-gradient(135deg,#0284c7 0%,#00f2fe 30%,#a855f7 70%,#facc15 100%);color:#fff;border:none;border-radius:9999px;padding:20px 56px;font-size:26px;font-weight:900;cursor:pointer;box-shadow:0 8px 30px rgba(2,132,199,0.5),0 0 25px rgba(250,204,21,0.4);letter-spacing:1px;transition:all 0.25s;">Pay ₹999 & Unlock Instant Access</button>
          </div>
        </div>
        <div style="margin-top:26px;text-align:center;z-index:1;">
          <span style="font-size:22px;color:#38bdf8;font-weight:800;">🛡️ 100% Secure Payment via Razorpay</span>
        </div>
        <div style="margin-top:14px;text-align:center;z-index:1;">
          <span style="font-size:19px;color:#fef08a;font-weight:700;">⚡ Instant video access granted automatically!</span>
        </div>
      </div>
      <div id="scanResult" style="margin-bottom:16px;font-size:20px;color:#D4AF37;font-weight:600;"></div>
      <button class="btn" id="goWelcomeBtn" style="display:none;background:#D4AF37;border-radius:18px;font-size:22px;padding:16px 36px;box-shadow:0 2px 8px #ff4e50;transition:background 0.3s;">Go to Welcome Page</button>
    </div>
    <footer style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;margin-top:24px;">
      <hr style="width:100vw;margin:0 0 10px 0;border:1px solid #ff4e50;">
      <span style="color:#fff;font-size:17px;font-weight:700;text-shadow:1px 1px 4px #ff4e50;">ALL RIGHTS RESERVED</span>
    </footer>
    <script src="https://unpkg.com/html5-qrcode@2.3.7/minified/html5-qrcode.min.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
      // Enforce backend payment status check on page load
      (async function() {
        try {
          const res = await fetch('/user-access-status', { credentials: 'include' });
          if (res.ok) {
            const status = await res.json();
            if (status.scanPaid) {
              localStorage.setItem('scanPaid', 'true');
              localStorage.setItem('accessGranted', 'true');
              localStorage.setItem('paymentStatus', '1499');
              window.location.href = 'WelcomePage.html';
              return;
            } else {
              localStorage.removeItem('scanPaid');
            }
          }
        } catch (e) {
          // Optionally show error or fallback
        }
      })();
      let scanned = false;
      const goWelcomeBtn = document.createElement('button');
      goWelcomeBtn.className = 'btn';
      goWelcomeBtn.textContent = 'Go to Welcome Page';
      goWelcomeBtn.style.display = 'none';
      document.querySelector('.container').appendChild(goWelcomeBtn);
      goWelcomeBtn.onclick = function() {
        window.location.href = "BusinessAccount.html";
      };
      // Disable payment button if already paid
      const scanPaid = localStorage.getItem('scanPaid') === 'true';
      const scanPayBtn = document.getElementById('payBtn');
      if (scanPaid && scanPayBtn) {
        scanPayBtn.textContent = 'Already Paid';
        scanPayBtn.disabled = true;
        scanPayBtn.style.opacity = '0.6';
      }
      // Razorpay ₹1000 payment button (UPI enforced)
      document.getElementById("payBtn").addEventListener("click", function() {
        const userId = localStorage.getItem('userId');
        const email = localStorage.getItem('email') || '';
        const name = localStorage.getItem('name') || '';
        fetch("/create-order", {
          method: "POST",
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, amount: 99900, purpose: 'scan' }) // ₹999 in paise
        })
          .then(res => res.json())
          .then(order => {
            if (order && order.id) {
              const options = {
                key: 'rzp_live_SgVjOOUUHbzBIS', // Razorpay live key
                amount: order.amount,
                currency: order.currency,
                name: 'GLOBAL DIGI PULSE',
                description: 'Access Program',
                order_id: order.id,
                handler: function (response) {
                  // Verify payment on backend before redirect
                  fetch('/verify-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                      razorpay_payment_id: response.razorpay_payment_id,
                      razorpay_order_id: response.razorpay_order_id,
                      razorpay_signature: response.razorpay_signature,
                      userId: userId
                    })
                  })
                    .then(res => res.json())
                    .then(data => {
                      if (data.success) {
                        localStorage.setItem('scanPaid', 'true');
                        localStorage.setItem('accessGranted', 'true');
                        localStorage.setItem('paymentStatus', '1499');
                        window.location.href = 'WelcomePage.html';
                      } else {
                        alert('Payment verification failed. Please contact support.');
                      }
                    })
                    .catch(() => {
                      alert('Server error during payment verification.');
                    });
                },
                prefill: {
                  name: name,
                  email: email
                },
                theme: {
                  color: '#ff4e50'
                },
                modal: {
                  ondismiss: function() {
                    // Optionally handle modal close
                  }
                }
              };
              const rzp = new Razorpay(options);
              rzp.open();
            } else {
              alert('Failed to create order.');
            }
          })
          .catch(() => {
            alert('Server error.');
          });
      });
      // 7-minute countdown timer logic
      (function() {
        const timerDisplay = document.getElementById('timer');
        // Do not disable the pay button when timer ends
        let timeLeft = 7 * 60; // 7 minutes in seconds
        let timerInterval = setInterval(function() {
          let min = Math.floor(timeLeft / 60);
          let sec = timeLeft % 60;
          timerDisplay.textContent = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            document.getElementById('offer-timer').textContent = 'Offer expired. Please refresh the page to try again or proceed to pay.';
            // Do NOT disable or change the pay button
          }
          timeLeft--;
        }, 1000);
      })();
    </script>
    <script src="../js/madgicx-motion.js?v=1.0"></script>
</body>
</html>
